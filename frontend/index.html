<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligent Timetable Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 20px 40px -10px rgba(99, 102, 241, 0.1);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-area h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .logo-area p {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border-radius: 0.75rem;
            border: 2px solid var(--border);
            background-color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.5rem;
            display: none;
            align-items: center;
            gap: 0.25rem;
        }

        .error-message.active {
            display: flex;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Intelligent Timetable Management System</h1>
            <p>Faculty & Administrator Login</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="faculty@gicemadhubani.ac.in" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -10px; margin-bottom: 20px; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-main); font-weight: 500;">
                    <input type="checkbox" checked style="accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer;">
                    Remember me
                </label>
                <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>

            <div id="formError" class="error-message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="errorText">Invalid email or password.</span>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Secure Login</span>
                <div class="spinner" id="spinner"></div>
            </button>

        </form>


    </div>

    <script>
        // Auto-fill for seamless showcase presentation
        document.getElementById('email').value = "demo@faculty.com";
        document.getElementById('password').value = "password123";

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('formError');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            // Reset state
            errorBox.classList.remove('active');
            btn.disabled = true;
            btnText.textContent = "Authenticating...";
            spinner.style.display = "block";

            // Simulate network delay for realism (1.2 seconds)
            await new Promise(r => setTimeout(r, 1200));

            // Allow any credentials for the hackathon showcase
            if (email.includes('@') && password.length > 0) {
                // Success!
                btnText.textContent = "Success! Redirecting...";
                spinner.style.display = "none";
                btn.style.background = "var(--success)";
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                // Error!
                btn.disabled = false;
                btnText.textContent = "Secure Login";
                spinner.style.display = "none";
                
                // Add a small shake animation to the form or error box
                errorBox.classList.add('active');
                
                // Remove animation class after it plays so it can play again on next fail
                setTimeout(() => {
                    errorBox.classList.remove('active');
                    // Force reflow
                    void errorBox.offsetWidth;
                    errorBox.classList.add('active');
                }, 10);
            }
        }
    </script>

</body>
</html>
